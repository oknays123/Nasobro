<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minecraft Mini v5 – Multiplayer Castle Builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace;
              touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; touch-action:none; }

  #cross {
    position:fixed; top:50%; left:50%; width:22px; height:22px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:5;
  }
  #cross::before, #cross::after { content:''; position:absolute; background:#fff; box-shadow:0 0 3px #000; }
  #cross::before { top:10px; left:0; width:22px; height:2px; }
  #cross::after  { top:0; left:10px; width:2px; height:22px; }

  #hud {
    position:fixed; top:8px; left:8px; color:#fff; font-size:11px;
    background:rgba(0,0,0,.5); padding:5px 9px; border-radius:4px; z-index:6;
    line-height:1.5;
  }

  #coords {
    position:fixed; top:8px; right:8px; color:#fff; font-size:11px;
    background:rgba(0,0,0,.5); padding:4px 8px; border-radius:4px; z-index:6;
  }
  #mode {
    position:fixed; top:56px; right:8px; color:#fff; font-size:11px;
    background:rgba(0,0,0,.5); padding:4px 8px; border-radius:4px; z-index:6;
    border:1px solid transparent;
  }
  #mode.fly { border-color:#8cf; color:#8cf; }

  #playersList {
    position:fixed; top:88px; right:8px; color:#fff; font-size:10px;
    background:rgba(0,0,0,.5); padding:5px 8px; border-radius:4px; z-index:6;
    max-width:160px;
  }
  #playersList .p { color:#8f8; }
  #playersList .me { color:#8cf; font-weight:bold; }

  #joy {
    position:fixed; bottom:24px; left:24px; width:130px; height:130px;
    border-radius:50%; background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.35); z-index:10;
    touch-action:none;
  }
  #joyKnob {
    position:absolute; top:50%; left:50%; width:56px; height:56px;
    margin:-28px 0 0 -28px; border-radius:50%;
    background:rgba(255,255,255,.55); border:2px solid #fff;
    z-index:11; pointer-events:none;
  }

  .btn {
    position:fixed; z-index:10; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; font-weight:bold;
    background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.55);
    text-align:center; touch-action:none;
    transition:background .08s;
  }
  .btn.pressed { background:rgba(120,200,120,.65); }

  #btnBreak { right:20px;  bottom:150px; width:70px; height:70px; }
  #btnPlace { right:100px; bottom:90px;  width:70px; height:70px; }
  #btnJump  { right:20px;  bottom:60px;  width:70px; height:70px; }
  #btnSprint{ right:100px; bottom:20px;  width:60px; height:60px; font-size:10px; }
  #btnSneak { right:180px; bottom:80px;  width:60px; height:60px; font-size:10px; }
  #btnFly   { right:180px; bottom:150px; width:60px; height:60px; font-size:10px; }
  #btnUndo  { right:250px; bottom:20px;  width:60px; height:60px; font-size:10px; }
  #btnSave  { right:250px; bottom:90px;  width:60px; height:60px; font-size:10px; }

  #hotbar {
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; padding:5px; background:rgba(0,0,0,.5);
    border-radius:6px; z-index:10; touch-action:none;
    max-width:calc(100vw - 20px); overflow-x:auto;
    scrollbar-width:none;
  }
  #hotbar::-webkit-scrollbar { display:none; }
  .slot {
    width:44px; height:44px; flex:0 0 44px; border:3px solid #333; border-radius:4px;
    color:#fff; font-size:8px; display:flex; align-items:flex-end; justify-content:center;
    text-shadow:1px 1px 2px #000; padding-bottom:2px;
    position:relative; overflow:hidden;
  }
  .slot::before {
    content:''; position:absolute; inset:2px; border-radius:2px;
    background:inherit; opacity:.85;
  }
  .slot span { position:relative; z-index:1; }
  .slot.active { border-color:#fff; box-shadow:0 0 10px #fff; }

  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.9); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100; text-align:center; padding:20px;
  }
  #overlay h1 { font-size:26px; letter-spacing:4px; margin-bottom:18px; color:#8cf; }
  #overlay p  { font-size:12px; margin:4px 0; opacity:.85; line-height:1.6; }
  #overlay b  { color:#8cf; }
  #overlay .btnRow { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  #overlay button {
    background:#2a4a6a; color:#fff; border:2px solid #8cf; border-radius:6px;
    padding:12px 22px; font-family:monospace; font-size:14px; cursor:pointer;
  }

  #nameRow { display:flex; gap:8px; margin-top:14px; align-items:center; }
  #nameRow input {
    background:#111; color:#8cf; border:2px solid #8cf; border-radius:6px;
    padding:8px 12px; font-family:monospace; font-size:13px; width:150px;
    text-align:center;
  }

  #toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85); color:#8cf; padding:10px 20px; border-radius:6px;
    font-size:14px; z-index:200; pointer-events:none;
    opacity:0; transition:opacity .3s;
  }
  #toast.show { opacity:1; }

  #hitFlash {
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4;
    transition:opacity .12s;
  }
</style>

<div id="cross"></div>
<div id="hud">FPS: <span id="fps">0</span></div>

<div id="playersList"></div>

<div id="joy"><div id="joyKnob"></div></div>

<div class="btn" id="btnBreak">BREAK</div>
<div class="btn" id="btnPlace">PLACE</div>

<div class="btn" id="btnSprint">SPRINT</div>

<div id="hotbar"></div>

<div id="overlay">
  <h1>CASTLE BUILDER v5</h1>
  <p><b>Multiplayer Edition</b></p>
  <p>Open this page in <b>2 tabs</b> to play with a friend</p>
  <p>Joystick = move • Swipe right = look</p>
  <p>BREAK / PLACE / JUMP • FLY / SPRINT / SNEAK</p>

  </div>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  BLOCK TYPES
// ============================================================
const BLOCK_TYPES = {
  grass:  { color:0x6b8c42, label:'Grass' },
  dirt:   { color:0x8b5a2b, label:'Dirt' },
  stone:  { color:0x808080, label:'Stone' },
  cobble: { color:0x6e6e6e, label:'Cobble' },
  wood:   { color:0xa0703c, label:'Wood' },
  plank:  { color:0xc9a063, label:'Plank' },
  leaf:   { color:0x3a7a2a, label:'Leaf' },
  brick:  { color:0xa04a3a, label:'Brick' },
  sand:   { color:0xe0d09a, label:'Sand' },
  glass:  { color:0xa8d8f0, label:'Glass', transparent:true, opacity:0.45 },
  water:  { color:0x3a6acc, label:'Water', transparent:true, opacity:0.65, liquid:true },
  dark:   { color:0x3a3a3a, label:'Dark' },
  mossy:  { color:0x5a7a4a, label:'Mossy' },
  snow:   { color:0xf0f0f8, label:'Snow' },
};

// ============================================================
//  RENDERER
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color(0x88bbee);
const SKY_DUSK = new THREE.Color(0xff9a5a);
const SKY_NIGHT = new THREE.Color(0x0a0a2a);
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(scene.background.clone(), 50, 140);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 400);
camera.rotation.order = 'YXZ';

const skyGeo = new THREE.SphereGeometry(300, 16, 12);
const skyMat = new THREE.MeshBasicMaterial({ color: SKY_DAY, side: THREE.BackSide, fog:false });
const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(8, 8, 6),
  new THREE.MeshBasicMaterial({ color:0xfff3d1, fog:false })
);
scene.add(sunMesh);
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(5, 8, 6),
  new THREE.MeshBasicMaterial({ color:0xddddff, fog:false })
);
scene.add(moonMesh);

// ============================================================
//  LIGHTS
// ============================================================
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xfff3d1, 0.85);
sunLight.position.set(60, 100, 40);
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xaaccff, 0.25);
fillLight.position.set(-40, 60, -30);
scene.add(fillLight);

// ============================================================
//  MATERIALS
// ============================================================
const materials = {};
for (const [name, def] of Object.entries(BLOCK_TYPES)) {
  const opts = { color: def.color };
  if (def.transparent) {
    opts.transparent = true;
    opts.opacity = def.opacity;
  }
  materials[name] = new THREE.MeshLambertMaterial(opts);
}
const GEO = new THREE.BoxGeometry(1, 1, 1);

// ============================================================
//  WORLD DATA
// ============================================================
const R     = 64;
const GY    = 4;
const MAX_Y = 60;
const SAVE_KEY = 'mcmini_v5_save';
const MAX_UNDO = 50;

const blockData = new Map();
const keyOf = (x,y,z) => x + ',' + y + ',' + z;

const undoStack = [];

const MAX_INSTANCES = 100000;
const instances = {};
const dummy = new THREE.Object3D();

for (const name of Object.keys(BLOCK_TYPES)) {
  const im = new THREE.InstancedMesh(GEO, materials[name], MAX_INSTANCES);
  im.count = 0;
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.frustumCulled = false;
  scene.add(im);
  instances[name] = { mesh: im, count: 0, indices: new Map() };
}

function addBlock(type, x, y, z, recordUndo = true) {
  const k = keyOf(x, y, z);
  if (blockData.has(k)) return false;
  if (y < 0 || y > MAX_Y) return false;

  blockData.set(k, { type, x, y, z });

  const inst = instances[type];
  const idx = inst.count;
  dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
  dummy.updateMatrix();
  inst.mesh.setMatrixAt(idx, dummy.matrix);
  inst.indices.set(k, idx);
  inst.count++;
  inst.mesh.count = inst.count;
  inst.mesh.instanceMatrix.needsUpdate = true;

  if (recordUndo) pushUndo({ op:'add', type, x, y, z });
  return true;
}

function delBlock(x, y, z, recordUndo = true) {
  const k = keyOf(x, y, z);
  const d = blockData.get(k);
  if (!d) return false;

  const inst = instances[d.type];
  const idx = inst.indices.get(k);
  if (idx === undefined) return false;

  const lastIdx = inst.count - 1;
  if (idx !== lastIdx) {
    let lastKey = null;
    for (const [kk, ii] of inst.indices) {
      if (ii === lastIdx) { lastKey = kk; break; }
    }
    if (lastKey) {
      const tmpMat = new THREE.Matrix4();
      inst.mesh.getMatrixAt(lastIdx, tmpMat);
      inst.mesh.setMatrixAt(idx, tmpMat);
      inst.indices.set(lastKey, idx);
    }
  }
  inst.indices.delete(k);
  inst.count--;
  inst.mesh.count = inst.count;
  inst.mesh.instanceMatrix.needsUpdate = true;

  blockData.delete(k);

  if (recordUndo) pushUndo({ op:'del', type:d.type, x, y, z });
  return true;
}

function pushUndo(action) {
  undoStack.push(action);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function undo() {
  const a = undoStack.pop();
  if (!a) { showToast('Nothing to undo'); return; }
  if (a.op === 'add') delBlock(a.x, a.y, a.z, false);
  else if (a.op === 'del') addBlock(a.type, a.x, a.y, a.z, false);
  playSound('undo');
  showToast('Undo');
}

// ============================================================
//  LIQUID WATER
// ============================================================
function updateWater() {
  const waterBlocks = [];
  for (const [k, b] of blockData) {
    if (b.type === 'water') waterBlocks.push(b);
  }
  
  const toAdd = [];
  
  for (const w of waterBlocks) {
    const downKey = keyOf(w.x, w.y - 1, w.z);
    if (!blockData.has(downKey) && w.y > 0) {
      toAdd.push({ x: w.x, y: w.y - 1, z: w.z });
      continue;
    }
    
    if (w.y <= GY - 2) {
      const neighbors = [
        { x: w.x + 1, y: w.y, z: w.z },
        { x: w.x - 1, y: w.y, z: w.z },
        { x: w.x, y: w.y, z: w.z + 1 },
        { x: w.x, y: w.y, z: w.z - 1 },
      ];
      
      for (const n of neighbors) {
        const nk = keyOf(n.x, n.y, n.z);
        const existing = blockData.get(nk);
        if (!existing && !toAdd.some(a => a.x === n.x && a.y === n.y && a.z === n.z)) {
          const belowN = keyOf(n.x, n.y - 1, n.z);
          if (!blockData.has(belowN)) {
             toAdd.push(n);
          }
        }
      }
    }
  }
  
  let added = 0;
  for (const n of toAdd) {
    if (added >= 5) break;
    const nk = keyOf(n.x, n.y, n.z);
    if (!blockData.has(nk)) {
      if (addBlock('water', n.x, n.y, n.z, false)) added++;
    }
  }
  
  const toRemove = [];
  for (const w of waterBlocks) {
     let hasNeighbor = false;
     const check = [
        keyOf(w.x+1, w.y, w.z), keyOf(w.x-1, w.y, w.z),
        keyOf(w.x, w.y+1, w.z), keyOf(w.x, w.y-1, w.z),
        keyOf(w.x, w.y, w.z+1), keyOf(w.x, w.y, w.z-1)
     ];
     for (const k of check) {
        if (blockData.has(k)) { hasNeighbor = true; break; }
     }
     if (!hasNeighbor && w.y > 0 && w.y < MAX_Y) toRemove.push(w);
  }
  
  for (const w of toRemove) delBlock(w.x, w.y, w.z, false);
}

// ============================================================
//  TERRAIN
// ============================================================
function buildWorld() {
  const seed = Math.random() * 1000;
  function noise(x, z) {
    const s  = Math.sin(x * 0.12 + seed) * Math.cos(z * 0.13 - seed);
    const s2 = Math.sin(x * 0.31 + z * 0.27) * 0.5;
    const s3 = Math.sin(x * 0.07 + z * 0.09 + seed*2) * 0.8;
    return s * 1.2 + s2 + s3;
  }

  for (let x = -R; x < R; x++) {
    for (let z = -R; z < R; z++) {
      const h = Math.round(noise(x, z));
      const top = GY + h;

      let surface = 'grass';
      if (h <= -3) surface = 'water';
      else if (h >= 6) surface = 'snow';
      else if (h <= -1) surface = 'sand';

      addBlock(surface, x, top, z, false);
      for (let d = 1; d <= 2; d++) addBlock('dirt', x, top - d, z, false);
      for (let d = 3; d <= 6; d++) addBlock('stone', x, top - d, z, false);

      if (h <= -3) {
        for (let wy = top + 1; wy <= GY - 3; wy++) {
          addBlock('water', x, wy, z, false);
        }
      }
    }
  }

  let trees = 0, attempts = 0;
  while (trees < 70 && attempts < 800) {
    attempts++;
    const bx = Math.floor((Math.random() - 0.5) * (R * 1.7));
    const bz = Math.floor((Math.random() - 0.5) * (R * 1.7));
    if (Math.hypot(bx, bz) < 8) continue;
    const baseY = findGroundY(bx, bz);
    if (baseY === null) continue;
    const topBlock = blockData.get(keyOf(bx, baseY, bz));
    if (!topBlock || topBlock.type !== 'grass') continue;

    const H = 4 + Math.floor(Math.random() * 2);
    for (let i = 0; i < H; i++) addBlock('wood', bx, baseY + 1 + i, bz, false);
    const ty = baseY + H;
    for (let dx = -2; dx <= 2; dx++)
      for (let dz = -2; dz <= 2; dz++)
        for (let dy = 0; dy <= 1; dy++) {
          if (Math.abs(dx) + Math.abs(dz) + dy > 3) continue;
          if (dx === 0 && dz === 0 && dy === 0) continue;
          addBlock('leaf', bx + dx, ty + dy, bz + dz, false);
        }
    trees++;
  }

  const P = 8;
  for (let x = -P; x <= P; x++) {
    for (let z = -P; z <= P; z++) {
      const top = findGroundY(x, z);
      if (top === null) continue;
      const b = blockData.get(keyOf(x, top, z));
      if (b) {
        delBlock(x, top, z, false);
        addBlock('stone', x, top, z, false);
      }
    }
  }
}

function findGroundY(x, z) {
  for (let y = MAX_Y; y >= 0; y--) {
    if (blockData.has(keyOf(x, y, z))) return y;
  }
  return null;
}

// ============================================================
//  PLAYER MODEL  (head, body, 2 arms, 2 legs — Minecraft style)
// ============================================================
function makePlayerModel(skinColor, shirtColor, pantsColor, name, nameColor) {
  const group = new THREE.Group();

  const skinMat = new THREE.MeshLambertMaterial({ color: skinColor });
  const shirtMat = new THREE.MeshLambertMaterial({ color: shirtColor });
  const pantsMat = new THREE.MeshLambertMaterial({ color: pantsColor });

  // Legs (pivot at top so they swing from the hip)
  const legGeo = new THREE.BoxGeometry(0.25, 0.75, 0.25);
  const legL = new THREE.Mesh(legGeo, pantsMat);
  legL.geometry.translate(0, -0.375, 0);
  legL.position.set(-0.15, 0.75, 0);
  group.add(legL);

  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.geometry = legGeo.clone();
  legR.geometry.translate(0, -0.375, 0);
  legR.position.set(0.15, 0.75, 0);
  group.add(legR);

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), shirtMat);
  body.position.y = 1.125;
  group.add(body);

  // Arms (pivot at top so they swing from the shoulder)
  const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
  const armL = new THREE.Mesh(armGeo, shirtMat);
  armL.geometry.translate(0, -0.35, 0);
  armL.position.set(-0.35, 1.5, 0);
  group.add(armL);

  const armR = new THREE.Mesh(armGeo, shirtMat);
  armR.geometry = armGeo.clone();
  armR.geometry.translate(0, -0.35, 0);
  armR.position.set(0.35, 1.5, 0);
  group.add(armR);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
  head.position.y = 1.75;
  group.add(head);

  // Name tag
  const tag = makeNameTag(name, nameColor);
  tag.position.y = 2.2;
  group.add(tag);

  return {
    group, legL, legR, armL, armR, body, head, tag,
    walkPhase: 0
  };
}

function makeNameTag(name, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = color;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.6, 0.4, 1);
  return sprite;
}

// Animate legs/arms swinging
function animateWalk(model, dt, isMoving) {
  if (isMoving) {
    model.walkPhase += dt * 10;
    const swing = Math.sin(model.walkPhase) * 0.7;
    model.legL.rotation.x = swing;
    model.legR.rotation.x = -swing;
    model.armL.rotation.x = -swing;
    model.armR.rotation.x = swing;
  } else {
    // Return to rest
    model.legL.rotation.x *= 0.8;
    model.legR.rotation.x *= 0.8;
    model.armL.rotation.x *= 0.8;
    model.armR.rotation.x *= 0.8;
  }
}

// ============================================================
//  MULTIPLAYER
// ============================================================
const net = {
  channel: null,
  myId: Math.random().toString(36).slice(2, 9),
  myName: 'Player',
  players: new Map(),
  lastBroadcast: 0,
  broadcastInterval: 0.05,
  connected: false
};

function initNet() {
  try {
    net.channel = new BroadcastChannel('mcmini_v5_channel');
    net.channel.onmessage = (ev) => {
      const msg = ev.data;
      if (!msg || !msg.type) return;
      if (msg.id === net.myId) return;

      if (msg.type === 'hello') {
        net.channel.postMessage({
          type:'welcome', id: net.myId, name: net.myName,
          x: player.pos.x, y: player.pos.y, z: player.pos.z,
          yaw, pitch
        });
        ensureRemotePlayer(msg.id, msg.name);
      }
      else if (msg.type === 'welcome') {
        ensureRemotePlayer(msg.id, msg.name);
      }
      else if (msg.type === 'pos') {
        let rp = net.players.get(msg.id);
        if (!rp) rp = ensureRemotePlayer(msg.id, msg.name);
        rp.targetX = msg.x; rp.targetY = msg.y; rp.targetZ = msg.z;
        rp.targetYaw = msg.yaw;
        rp.lastSeen = performance.now();
        rp.name = msg.name || rp.name;
      }
      else if (msg.type === 'bye') {
        removeRemotePlayer(msg.id);
      }
      else if (msg.type === 'block') {
        if (msg.action === 'add') addBlock(msg.btype, msg.x, msg.y, msg.z, false);
        else if (msg.action === 'del') delBlock(msg.x, msg.y, msg.z, false);
      }
    };
    net.connected = true;
    net.channel.postMessage({
      type:'hello', id: net.myId, name: net.myName,
      x: player.pos.x, y: player.pos.y, z: player.pos.z,
      yaw, pitch
    });
  } catch(e) {
    console.warn('Multiplayer not available:', e);
    net.connected = false;
  }
}

  if (!net.channel) return;
  net.channel.postMessage({

    x: player.pos.x, y: player.pos.y, z: player.pos.z,

  });

function ensureRemotePlayer(id, name) {
  let rp = net.players.get(id);
  if (rp) return rp;

  const model = makePlayerModel(0xffcc99, 0xff6666, 0x3333aa, name || 'Player', '#ff8888');
  scene.add(model.group);

  rp = {
    id, name: name || 'Player',
    x:0, y:0, z:0, yaw:0,
    targetX:0, targetY:0, targetZ:0, targetYaw:0,
    lastSeen: performance.now(),
    model,
    prevX: 0, prevZ: 0
  };
  net.players.set(id, rp);
  updatePlayersList();
  return rp;
}

function removeRemotePlayer(id) {
  const rp = net.players.get(id);
  if (!rp) return;
  scene.remove(rp.model.group);
  net.players.delete(id);
  updatePlayersList();
}

function updateRemotePlayers(dt) {
  const now = performance.now();
  for (const [id, rp] of net.players) {
    if (now - rp.lastSeen > 5000) {
      removeRemotePlayer(id);
      continue;
    }

    const lerp = Math.min(1, dt * 12);
    rp.model.group.position.x += (rp.targetX - rp.model.group.position.x) * lerp;
    rp.model.group.position.y += (rp.targetY - rp.model.group.position.y) * lerp;
    rp.model.group.position.z += (rp.targetZ - rp.model.group.position.z) * lerp;

    // Yaw lerp
    let dyaw = rp.targetYaw - rp.model.group.rotation.y;
    while (dyaw > Math.PI) dyaw -= Math.PI * 2;
    while (dyaw < -Math.PI) dyaw += Math.PI * 2;
    rp.model.group.rotation.y += dyaw * Math.min(1, dt * 10);

    // Walk animation based on movement speed
    const moved = Math.hypot(
      rp.model.group.position.x - rp.prevX,
      rp.model.group.position.z - rp.prevZ
    );
    animateWalk(rp.model, dt, moved > 0.01);
    rp.prevX = rp.model.group.position.x;
    rp.prevZ = rp.model.group.position.z;
  }
}

function updatePlayersList() {
  const el = document.getElementById('playersList');

  for (const [id, rp] of net.players) {
    html += '<div class="p">■ ' + rp.name + '</div>';
  }
  el.innerHTML = html;
}

const bots = [];
const botSkins = [
  { skin:0xffcc99, shirt:0x66ccff, pants:0x2266aa, color:'#88ddff' },
  { skin:0xcc9966, shirt:0xffcc66, pants:0xaa7722, color:'#ffdd88' },
  { skin:0xffddaa, shirt:0x99ff99, pants:0x226622, color:'#aaffaa' },
  { skin:0xddbbaa, shirt:0xff99ff, pants:0x882288, color:'#ffaaff' },
  { skin:0xffcc99, shirt:0xcc99ff, pants:0x553388, color:'#ddaaff' },
];

function makeBot(name, skin, x, z) {
  const model = makePlayerModel(skin.skin, skin.shirt, skin.pants, name, skin.color);
  model.group.position.set(x, 0, z);
  scene.add(model.group);
  return {
    name, model,
    targetX: x, targetZ: z,
    yaw: 0,
    timer: 0,
    speed: 1.8 + Math.random() * 1.2,
    prevX: x, prevZ: z
  };
}

function initBots() {
  for (let i = 0; i < 4; i++) {
    const ang = (i / 4) * Math.PI * 2;
    const r = 20 + Math.random() * 20;
    const x = Math.cos(ang) * r;
    const z = Math.sin(ang) * r;
    const b = makeBot('Bot' + (i+1), botSkins[i % botSkins.length], x, z);
    b.targetX = x; b.targetZ = z;
    bots.push(b);
  }
}

function updateBots(dt) {
  for (const b of bots) {
    b.timer -= dt;
    if (b.timer <= 0) {
      b.timer = 3 + Math.random() * 5;
      b.targetX = (Math.random() - 0.5) * 80;
      b.targetZ = (Math.random() - 0.5) * 80;
    }

    const dx = b.targetX - b.model.group.position.x;
    const dz = b.targetZ - b.model.group.position.z;
    const dist = Math.hypot(dx, dz);
    let isMoving = false;

    if (dist > 1.5) {
      const nx = dx / dist, nz = dz / dist;
      b.model.group.position.x += nx * b.speed * dt;
      b.model.group.position.z += nz * b.speed * dt;
      b.yaw = Math.atan2(nx, nz);
      isMoving = true;
    }

    // Ground detection: cast down from above to find topmost solid block
    const gx = Math.floor(b.model.group.position.x);
    const gz = Math.floor(b.model.group.position.z);
    const groundY = findGroundY(gx, gz);

    let targetY;
    if (groundY !== null) {
      targetY = groundY + 1; // stand on top of ground block
    } else {
      targetY = 0;
    }

    // Smoothly move toward ground level, fast enough to not float
    b.model.group.position.y += (targetY - b.model.group.position.y) * Math.min(1, dt * 15);

    // Yaw smoothing
    let dyaw = b.yaw - b.model.group.rotation.y;
    while (dyaw > Math.PI) dyaw -= Math.PI * 2;
    while (dyaw < -Math.PI) dyaw += Math.PI * 2;
    b.model.group.rotation.y += dyaw * Math.min(1, dt * 8);

    // Walk animation
    animateWalk(b.model, dt, isMoving);
  }
}

let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playTone(freq, dur, type='square', vol=0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function playSound(name) {
  if (!audioCtx) return;
  switch(name) {
    case 'break': playTone(180, 0.08, 'square', 0.06); break;
    case 'place': playTone(320, 0.06, 'square', 0.05); break;
    case 'jump':  playTone(500, 0.09, 'sine',   0.04); break;
    case 'undo':  playTone(250, 0.1,  'triangle', 0.05); break;
    case 'save':  playTone(600, 0.12, 'sine',   0.06);
                  setTimeout(()=>playTone(800, 0.1, 'sine', 0.05), 80); break;
    case 'error': playTone(120, 0.15, 'sawtooth', 0.05); break;
  }
}

const joy = document.getElementById('joy');
const knob = document.getElementById('joyKnob');
let joyId = null;
let joyVec = { x:0, y:0 };

function joyMove(cx, cy) {
  const r = joy.getBoundingClientRect();
  const centerX = r.left + r.width / 2;
  const centerY = r.top + r.height / 2;
  let dx = cx - centerX;
  let dy = cy - centerY;
  const max = r.width / 2 - 4;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / max;
  joyVec.y = dy / max;
}
function joyEnd() {
  joyId = null;
  knob.style.transform = 'translate(0,0)';
  joyVec.x = 0; joyVec.y = 0;
}

// ============================================================
//  TOUCH: LOOK
// ============================================================
let lookId = null, lookLastX = 0, lookLastY = 0;
let sensitivity = 0.005;

// ============================================================
//  TOUCH HANDLERS
// ============================================================
function isOnButton(x, y) {
  const btns = ['btnBreak','btnPlace','btnJump','btnSprint','btnSneak','btnFly','btnUndo','btnSave'];
  for (const id of btns) {
    const el = document.getElementById(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
  }
  return false;
}

function isOnHotbar(x, y) {
  const r = document.getElementById('hotbar').getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

document.addEventListener('touchstart', (e) => {
  initAudio();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;

    const jr = joy.getBoundingClientRect();
    const pad = 40;
    if (x >= jr.left - pad && x <= jr.right + pad &&
        y >= jr.top  - pad && y <= jr.bottom + pad) {
      joyId = t.identifier;
      joyMove(x, y);
      continue;
    }

    if (isOnButton(x, y)) continue;
    if (isOnHotbar(x, y)) continue;

    if (lookId === null) {
      lookId = t.identifier;
      lookLastX = x; lookLastY = y;
    }
  }
}, { passive:false });

document.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyMove(t.clientX, t.clientY);
    } else if (t.identifier === lookId) {
      const dx = t.clientX - lookLastX;
      const dy = t.clientY - lookLastY;
      lookLastX = t.clientX;
      lookLastY = t.clientY;
      yaw   -= dx * sensitivity;
      pitch -= dy * sensitivity;
      const lim = Math.PI / 2 - 0.001;
      pitch = Math.max(-lim, Math.min(lim, pitch));
    }
  }
  e.preventDefault();
}, { passive:false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) joyEnd();
    if (t.identifier === lookId) lookId = null;
  }
}
document.addEventListener('touchend',    endTouch, { passive:false });
document.addEventListener('touchcancel', endTouch, { passive:false });

// ============================================================
//  VOXEL RAYCAST
// ============================================================
const rayDir = new THREE.Vector3();
const rayPos = new THREE.Vector3();
const REACH = 14;

function getTarget(maxDist = REACH) {
  camera.getWorldDirection(rayDir);
  rayPos.copy(camera.position);

  let x = Math.floor(rayPos.x);
  let y = Math.floor(rayPos.y);
  let z = Math.floor(rayPos.z);

  const stepX = Math.sign(rayDir.x);
  const stepY = Math.sign(rayDir.y);
  const stepZ = Math.sign(rayDir.z);

  const tDeltaX = stepX !== 0 ? Math.abs(1 / rayDir.x) : Infinity;
  const tDeltaY = stepY !== 0 ? Math.abs(1 / rayDir.y) : Infinity;
  const tDeltaZ = stepZ !== 0 ? Math.abs(1 / rayDir.z) : Infinity;

  let tMaxX = stepX > 0 ? (x + 1 - rayPos.x) * tDeltaX
            : stepX < 0 ? (rayPos.x - x) * tDeltaX : Infinity;
  let tMaxY = stepY > 0 ? (y + 1 - rayPos.y) * tDeltaY
            : stepY < 0 ? (rayPos.y - y) * tDeltaY : Infinity;
  let tMaxZ = stepZ > 0 ? (z + 1 - rayPos.z) * tDeltaZ
            : stepZ < 0 ? (rayPos.z - z) * tDeltaZ : Infinity;

  let nx = 0, ny = 0, nz = 0;
  let t = 0;

  if (blockData.has(keyOf(x, y, z))) return { x, y, z, nx:0, ny:1, nz:0 };

  while (t <= maxDist) {
    if (tMaxX < tMaxY && tMaxX < tMaxZ) {
      x += stepX; t = tMaxX; tMaxX += tDeltaX;
      nx = -stepX; ny = 0; nz = 0;
    } else if (tMaxY < tMaxZ) {
      y += stepY; t = tMaxY; tMaxY += tDeltaY;
      nx = 0; ny = -stepY; nz = 0;
    } else {
      z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ;
      nx = 0; ny = 0; nz = -stepZ;
    }
    if (t > maxDist) break;
    if (y < 0 || y > MAX_Y) continue;
    if (blockData.has(keyOf(x, y, z))) return { x, y, z, nx, ny, nz };
  }
  return null;
}

// ============================================================
//  BREAK / PLACE
// ============================================================
function breakBlock() {
  const t = getTarget();
  if (!t) return;
  const b = blockData.get(keyOf(t.x, t.y, t.z));
  if (!b) return;
  if (b.type === 'water') {
    showToast('Water is liquid');
    playSound('error');
    return;
  }
  delBlock(t.x, t.y, t.z);
  broadcastBlock('del', b.type, t.x, t.y, t.z);
  playSound('break');
  flashHit();
}

function placeBlock() {
  const t = getTarget();
  if (!t) return;

  const px = t.x + t.nx;
  const py = t.y + t.ny;
  const pz = t.z + t.nz;

  if (py < 0 || py > MAX_Y) return;

  const hw = player.w / 2;
  const placingSolid = selectedBlock !== 'water';
  if (placingSolid &&
      px + 1 > player.pos.x - hw && px < player.pos.x + hw &&
      py + 1 > player.pos.y      && py < player.pos.y + player.h &&
      pz + 1 > player.pos.z - hw && pz < player.pos.z + hw) {
    playSound('error');
    return;
  }

  if (addBlock(selectedBlock, px, py, pz)) {
    broadcastBlock('add', selectedBlock, px, py, pz);
    playSound('place');
  } else {
    playSound('error');
  }
}

// ============================================================
//  SAVE / LOAD  (with file download/upload fallback)
// ============================================================
function saveWorld() {
  const arr = [];
  for (const d of blockData.values()) {
    arr.push([d.x, d.y, d.z, d.type]);
  }
  const data = JSON.stringify({
    v: 5,
    px: player.pos.x, py: player.pos.y, pz: player.pos.z,
    yaw, pitch,
    blocks: arr
  });

  // Try localStorage first
  try {
    localStorage.setItem(SAVE_KEY, data);
    showToast('Saved! (' + arr.length + ' blocks)');
    playSound('save');
    return;
  } catch (e) {
    // localStorage blocked (file:// on Chrome Android) — fall back to file download
    console.warn('localStorage blocked, using file download');
  }

  // Fallback: download as a .json file
  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mcmini_save.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('Saved as file download! (' + arr.length + ' blocks)');
    playSound('save');
  } catch (e) {
    showToast('Save failed');
    playSound('error');
  }
}

function loadWorld() {
  // Try localStorage first
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e) {}

  if (!raw) {
    // Fallback: prompt the user to pick a file
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = (ev) => {
      const f = ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = (re) => {
        try {
          const data = JSON.parse(re.target.result);
          applyLoadedData(data);
          overlay.style.display = 'none';
          initNet();
        } catch (e) { showToast('Load failed'); }
      };
      reader.readAsText(f);
    };
    input.click();
    return false;
  }

  try {
    const data = JSON.parse(raw);
    applyLoadedData(data);
    return true;
  } catch (e) {
    showToast('Load failed');
    return false;
  }
}

function applyLoadedData(data) {
  for (const type of Object.keys(instances)) {
    instances[type].count = 0;
    instances[type].indices.clear();
    instances[type].mesh.count = 0;
    instances[type].mesh.instanceMatrix.needsUpdate = true;
  }
  blockData.clear();
  undoStack.length = 0;

  for (const [x, y, z, type] of data.blocks) {
    if (instances[type]) addBlock(type, x, y, z, false);
  }
  if (data.px !== undefined) {
    player.pos.set(data.px, data.py, data.pz);
    player.vel.set(0, 0, 0);
  }
  if (data.yaw !== undefined) yaw = data.yaw;
  if (data.pitch !== undefined) pitch = data.pitch;

  showToast('Loaded! (' + data.blocks.length + ' blocks)');
  playSound('save');
}

// ============================================================
//  UPDATE
// ============================================================
let waterUpdateTimer = 0;

function update(dt) {
  waterUpdateTimer += dt;
  if (waterUpdateTimer > 0.5) {
    waterUpdateTimer = 0;
    updateWater();
  }

  net.lastBroadcast += dt;
  if (net.lastBroadcast > net.broadcastInterval && net.connected) {
    net.lastBroadcast = 0;
    broadcastMyPos();
  }

  updateRemotePlayers(dt);
  updateBots(dt);

  const fwd   = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));

  let speed = SPEED;
  if (player.flying) speed = FLY_SPEED;
  else if (sprintHeld && !sneakHeld) speed *= SPRINT_MULT;
  else if (sneakHeld) speed *= SNEAK_MULT;

  const wish = new THREE.Vector3();
  if (joyVec.y < -0.15) wish.add(fwd.clone().multiplyScalar(-joyVec.y));
  if (joyVec.y >  0.15) wish.add(fwd.clone().multiplyScalar(-joyVec.y));
  if (joyVec.x < -0.15) wish.add(right.clone().multiplyScalar(joyVec.x));
  if (joyVec.x >  0.15) wish.add(right.clone().multiplyScalar(joyVec.x));
  if (wish.lengthSq() > 1) wish.normalize();
  wish.multiplyScalar(speed);

  if (player.flying) {
    let vy = 0;
    if (jumpHeld)  vy += FLY_SPEED;
    if (sneakHeld) vy -= FLY_SPEED;
    player.vel.y = vy;
    if (jumpHeld && sneakHeld) player.vel.y = 0;
  } else {
    if (jumpHeld && player.onGround) {
      player.vel.y = JUMP;
      player.onGround = false;
      playSound('jump');
    }
    player.vel.y -= GRAV * dt;
    if (player.vel.y < -50) player.vel.y = -50;
  }

  const nx = player.pos.x + wish.x * dt;
  if (player.flying || !blocked(nx, player.pos.y, player.pos.z)) player.pos.x = nx;

  const nz = player.pos.z + wish.z * dt;
  if (player.flying || !blocked(player.pos.x, player.pos.y, nz)) player.pos.z = nz;

  const ny = player.pos.y + player.vel.y * dt;
  if (!player.flying && blocked(player.pos.x, ny, player.pos.z)) {
    if (player.vel.y < 0) {
      player.pos.y = Math.floor(ny) + 1;
      player.onGround = true;
    }
    player.vel.y = 0;
  } else {
    player.pos.y = ny;
    if (!player.flying) player.onGround = false;
  }

  if (player.pos.y < -20) {
    player.pos.set(0.5, GY + 4, 0.5);
    player.vel.set(0, 0, 0);
  }

  camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  skyDome.position.copy(camera.position);

  const t = getTarget();
  if (t) {
    outline.visible = true;
    outline.position.set(t.x + 0.5, t.y + 0.5, t.z + 0.5);

    const px = t.x + t.nx, py = t.y + t.ny, pz = t.z + t.nz;
    if (py >= 0 && py <= MAX_Y) {
      ghost.visible = true;
      ghostEdges.visible = true;
      ghost.position.set(px + 0.5, py + 0.5, pz + 0.5);
      ghostEdges.position.copy(ghost.position);
      const def = BLOCK_TYPES[selectedBlock];
      ghostMat.color.setHex(def.color);
      ghostEdges.material.color.setHex(def.color);
    } else {
      ghost.visible = false;
      ghostEdges.visible = false;
    }
  } else {
    outline.visible = false;
    ghost.visible = false;
    ghostEdges.visible = false;
  }

  coordsEl.textContent = `${Math.floor(player.pos.x)}, ${Math.floor(player.pos.y)}, ${Math.floor(player.pos.z)}`;
}

// ============================================================
//  DAY / NIGHT CYCLE
// ============================================================
let dayTime = 0.25;
const DAY_LENGTH = 180;

function updateSky(dt) {
  dayTime = (dayTime + dt / DAY_LENGTH) % 1;

  const angle = dayTime * Math.PI * 2 - Math.PI / 2;
  const sunDist = 200;
  const sunX = Math.cos(angle) * sunDist;
  const sunY = Math.sin(angle) * sunDist;
  const sunZ = Math.sin(angle * 0.5) * 50;

  sunMesh.position.set(sunX, sunY, sunZ);
  moonMesh.position.set(-sunX, -sunY, -sunZ);

  sunLight.position.set(sunX * 0.5, Math.max(sunY, 10), sunZ);
  sunLight.intensity = Math.max(0, Math.sin(angle)) * 0.9 + 0.05;
  ambient.intensity = 0.25 + Math.max(0, Math.sin(angle)) * 0.5;

  let skyColor;
  const dayFactor = Math.sin(angle);
  if (dayFactor > 0.3) skyColor = SKY_DAY.clone();
  else if (dayFactor > -0.1) {
    const t = (dayFactor + 0.1) / 0.4;
    skyColor = SKY_DUSK.clone().lerp(SKY_DAY, t);
  } else if (dayFactor > -0.3) {
    const t = (dayFactor + 0.3) / 0.2;
    skyColor = SKY_NIGHT.clone().lerp(SKY_DUSK, t);
  } else skyColor = SKY_NIGHT.clone();

  scene.background.copy(skyColor);
  scene.fog.color.copy(skyColor);
  skyMat.color.copy(skyColor);
}

// ============================================================
//  STARTUP
// ============================================================
buildWorld();
initBots();

if (localStorage.getItem(SAVE_KEY)) {
  document.getElementById('btnLoad').style.display = 'inline-block';
}

(function spawnSafe() {
  const top = findGroundY(0, 0);
  if (top !== null) player.pos.set(0.5, top + 3, 0.5);
})();

// ============================================================
//  LOOP
// ============================================================
let prev = performance.now();
let fpsN = 0, fpsT = 0;
const fpsEl = document.getElementById('fps');
const coordsEl = document.getElementById('coords');

function loop(now) {
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;

  updateSky(dt);
  update(dt);
  renderer.render(scene, camera);

  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) {
    fpsEl.textContent = Math.round(fpsN / fpsT);
    fpsN = 0; fpsT = 0;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============================================================
//  RESIZE
// ============================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('beforeunload', () => {
  if (net.channel) {
    net.channel.postMessage({ type:'bye', id: net.myId });
    net.channel.close();
  }
});
</script>
